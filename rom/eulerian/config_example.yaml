# ==========================================================================
# Eulerian Field Reconstruction – Configuration Example
# ==========================================================================
#
# This file controls the conversion of Lagrangian vortex-particle snapshots
# (from FLOWUnsteady / rVPM) into Eulerian velocity and vorticity fields
# on a fixed Cartesian grid, stored as chunked HDF5 datasets.
#
# Copy this file and edit to match your simulation setup.
# ==========================================================================

# --------------------------------------------------------------------------
# Grid definition
# --------------------------------------------------------------------------
grid:
  bounds:
    x: [-2.0, 6.0]      # streamwise extent  [m]
    y: [-3.0, 3.0]       # spanwise  extent   [m]
    z: [-3.0, 3.0]       # vertical  extent   [m]

  resolution:
    x: 81                 # grid points along x
    y: 61                 # grid points along y
    z: 61                 # grid points along z

  axis_order: "xyz"       # storage layout – permutation of 'xyz'
  spacing_type: "uniform" # 'uniform' or 'cosine'
  units: "m"              # length units (label only; no conversion)

  # Optionally supply explicit 1-D coordinate arrays.  When present they
  # override bounds, resolution, and spacing_type for the given axis.
  # custom_coords:
  #   x: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0, 4.0, 6.0]

# --------------------------------------------------------------------------
# Particle data source
# --------------------------------------------------------------------------
particles:
  # Directory containing particle snapshot files (VTK / HDF5 / CSV).
  data_dir: "./simulation_output/pfield"

  # File naming pattern.  Use {step:d} or {step:05d} for the time-step index.
  file_pattern: "pfield_{step:05d}.h5"

  # Snapshot selection – which time-step indices to process.
  # 'all' reads every file matching the pattern.
  # A list [start, stop, stride] selects a subset.
  snapshot_selection: [0, 1000, 10]   # steps 0, 10, 20, …, 1000

  # Physical time associated with each snapshot (seconds).
  # Option A: provide dt so that  t_k = k * dt.
  dt: 0.001

  # Option B: provide an explicit list (overrides dt if present).
  # times: [0.0, 0.01, 0.02, ...]

# --------------------------------------------------------------------------
# Kernel evaluation
# --------------------------------------------------------------------------
kernel:
  # Regularisation type – must match the FLOWUnsteady / rVPM setting.
  # Supported: 'gaussianerf', 'winckelmans', 'singular'
  type: "gaussianerf"

# --------------------------------------------------------------------------
# Evaluation parameters
# --------------------------------------------------------------------------
evaluation:
  # Maximum number of target grid points evaluated per chunk.
  # Larger → faster (fewer Python loops) but more RAM.
  chunk_size: 8192

  # Whether to reject particles with NaN / Inf / σ ≤ 0.
  validate_particles: true

# --------------------------------------------------------------------------
# Field selection
# --------------------------------------------------------------------------
fields:
  velocity: true          # always required for ROM data
  vorticity: true         # optional; set false to skip

# --------------------------------------------------------------------------
# Numerical differentiation (for vorticity computation)
# --------------------------------------------------------------------------
differentiation:
  scheme: "central"       # 'central'
  order: 2                # 2 or 4 (4th-order only for uniform grids)

# --------------------------------------------------------------------------
# Fluid-domain masking (optional)
# --------------------------------------------------------------------------
# masking:
#   type: "sphere"
#   centre: [0.0, 0.0, 0.0]
#   radius: 0.5
#   inside_is_solid: true

# --------------------------------------------------------------------------
# Output
# --------------------------------------------------------------------------
output:
  directory: "./eulerian_output"
  filename: "eulerian_fields.h5"

  # HDF5 compression
  compression: "gzip"
  compression_level: 4
